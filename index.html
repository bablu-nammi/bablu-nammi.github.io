<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bharani Nammi — Deep Learning Researcher</title>
  <meta name="description" content="Bharani Nammi — Deep Learning Engineer & Researcher. Interactive portfolio."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;height:100%;overflow:hidden;background:#03050e;font-family:'Inter',system-ui,sans-serif;}

    /* ── Three.js container ─────────────────────────────── */
    #three-container { position:fixed; inset:0; z-index:10; transition:opacity 0.3s; }
    .label3d {
      font-family:'Inter',sans-serif; font-size:10px; font-weight:700;
      color:#c4cde8; text-align:center; line-height:1.35; white-space:nowrap;
      text-transform:uppercase; letter-spacing:0.6px;
      opacity:0; transform:translateY(4px);
      transition:opacity 0.22s, transform 0.22s;
      pointer-events:none;
      text-shadow:0 1px 6px rgba(3,5,14,0.9);
      padding:2px 6px; border-radius:4px;
      background:rgba(3,5,14,0.35);
    }
    .label3d.visible { opacity:1; transform:translateY(0); }
.label3d.label-light { color:#1e2a5e; background:rgba(221,228,245,0.88); text-shadow:none; }

    /* Keep dark for space even in light mode */
    body { background:#03050e; }
    body.light { background:#03050e; }

    /* ── Click-catcher (invisible, no darken) ───────────── */
    /* click-catcher: left portion only, no dimming */
    #zoom-backdrop{
      position:fixed;left:0;top:0;bottom:0;width:50%;
      z-index:290;opacity:0;pointer-events:none;
      transition:opacity 0.3s;
    }
    body.zoomed-in #zoom-backdrop{opacity:1;pointer-events:auto;}

    /* ── Right-panel blended into scene (no box) ─────────── */
    #content-card{
      --nc:#6366f1;
      position:fixed;right:0;top:0;bottom:0;
      width:52%;max-width:700px;
      transform:scale(0.94) translateX(16px);
      opacity:0;filter:blur(10px);pointer-events:none;
      /* gradient fades from transparent on the left into the background */
      background:linear-gradient(to right,
        rgba(3,5,14,0) 0%,
        rgba(3,5,14,0.94) 14%,
        rgba(3,5,14,0.97) 100%);
      border:none;
      border-left:1px solid color-mix(in srgb,var(--nc) 22%,transparent);
      border-radius:0;
      z-index:300;
      transition:transform 0.42s cubic-bezier(0.34,1.4,0.64,1),
                 opacity 0.28s ease,
                 filter 0.32s ease,
                 border-color 0.3s;
      display:flex;flex-direction:column;
      overflow:hidden;
    }
    body.zoomed-in #content-card{
      opacity:1;pointer-events:auto;
      transform:scale(1) translateX(0);
      filter:blur(0px);
    }

    .card-topbar{
      display:flex;align-items:center;gap:14px;
      padding:22px 32px 16px 28px;
      border-bottom:1px solid rgba(255,255,255,0.05);
      flex-shrink:0;
      background:transparent;
    }
    .back-btn{
      background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.22);
      color:#818cf8;padding:6px 14px;border-radius:8px;cursor:pointer;
      font-family:inherit;font-size:12px;font-weight:700;
      display:flex;align-items:center;gap:6px;transition:all 0.2s;
      flex-shrink:0;
    }
    .back-btn:hover{background:rgba(99,102,241,0.2);color:#c7d2fe;}
    .card-title-wrap{flex:1;}
    .card-title{font-size:22px;font-weight:800;color:#eef2ff;letter-spacing:-0.5px;}
    .card-sub{font-size:13px;font-weight:500;margin-top:3px;}

    .card-node-tag{
      display:inline-flex;align-items:center;gap:5px;
      font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:1px;
      color:var(--nc);background:color-mix(in srgb,var(--nc) 12%,transparent);
      border:1px solid color-mix(in srgb,var(--nc) 30%,transparent);
      border-radius:20px;padding:2px 9px;margin-bottom:5px;width:fit-content;
    }
    .card-node-dot{width:6px;height:6px;border-radius:50%;background:var(--nc);display:inline-block;}
    @keyframes cardBodyIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .card-body{
      flex:1;overflow-y:auto;padding:24px 32px 48px 28px;
      scrollbar-width:thin;scrollbar-color:#1a2236 transparent;
      animation:cardBodyIn 0.32s ease both;
    }
    .card-body::-webkit-scrollbar{width:4px;}
    .card-body::-webkit-scrollbar-thumb{background:#1a2236;border-radius:3px;}

    /* Layout: single column for clarity */
    .two-col{display:flex;flex-direction:column;gap:16px;}

    /* ── About ──────────────────────────────────────────── */
    .about-layout{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;}
    @media(max-width:700px){.about-layout{grid-template-columns:1fr;}}
    .about-left{}
    .about-hero{display:flex;gap:22px;align-items:flex-start;margin-bottom:24px;}
    .about-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#4f46e5);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:white;flex-shrink:0;}
    .about-name{font-size:26px;font-weight:900;letter-spacing:-1px;color:#eef2ff;margin-bottom:5px;}
    .about-role{font-size:13.5px;color:#818cf8;font-weight:600;margin-bottom:10px;}
    .about-locs{display:flex;gap:7px;flex-wrap:wrap;}
    .loc-chip{background:#0c1020;border:1px solid #161e30;color:#7c88a8;font-size:11px;font-weight:600;padding:3px 10px;border-radius:6px;}
    .about-bio{font-size:14px;color:#7c88a8;line-height:1.85;margin-bottom:0;}
    .about-right{}
    .about-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px;}
    .ast{background:#0c1020;border:1px solid #161e30;border-radius:12px;padding:18px;text-align:center;}
    .ast-v{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:#eef2ff;}
    .ast-l{font-size:10px;color:#3d4a6a;text-transform:uppercase;letter-spacing:0.8px;margin-top:4px;}
    .about-links{display:flex;gap:9px;flex-wrap:wrap;}
    .alink{display:flex;align-items:center;gap:7px;background:#0c1020;border:1px solid #1e2840;color:#7c88a8;text-decoration:none;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;transition:all 0.2s;}
    .alink:hover{border-color:#6366f1;color:#eef2ff;}

    /* ── Papers ─────────────────────────────────────────── */
    .papers-grid{display:flex;flex-direction:column;gap:16px;}
    .paper-card{background:rgba(12,16,32,0.7);border:1px solid #1e2840;border-radius:14px;padding:22px 24px;transition:border-color 0.2s;}
    .paper-card:hover{border-color:#2d3a5a;}
    .paper-title{font-size:15.5px;font-weight:700;color:#eef2ff;line-height:1.5;margin-bottom:7px;}
    .paper-authors{font-size:13px;color:#818cf8;margin-bottom:4px;font-weight:500;}
    .paper-venue{font-size:12.5px;color:#4a5568;font-style:italic;margin-bottom:12px;}
    .paper-abstract{font-size:13.5px;color:#a0aec0;line-height:1.75;margin-bottom:14px;}
    .paper-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
    .paper-tags{display:flex;gap:6px;flex-wrap:wrap;}
    .ptag{background:rgba(6,182,212,0.07);border:1px solid rgba(6,182,212,0.22);color:#06b6d4;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:5px;}
    .paper-year{font-family:'JetBrains Mono',monospace;font-size:11px;color:#4a5568;background:#070a16;border:1px solid #1e2840;padding:3px 9px;border-radius:5px;}
    .paper-link{font-size:13px;color:#818cf8;text-decoration:none;font-weight:600;display:flex;align-items:center;gap:4px;}
    .paper-link:hover{color:#c7d2fe;}
    .papers-drop{background:#070a16;border:2px dashed rgba(99,102,241,0.2);border-radius:12px;padding:36px 22px;text-align:center;}
    .papers-drop strong{display:block;font-size:14px;color:#94a3b8;margin-bottom:6px;}
    .papers-drop span{font-size:12px;color:#4a5568;line-height:1.7;display:block;}

    /* ── Awards ─────────────────────────────────────────── */
    .awards-grid{display:flex;flex-direction:column;gap:16px;}
    .award-card{background:rgba(12,16,32,0.7);border:1px solid #1e2840;border-radius:14px;padding:22px 24px;position:relative;overflow:hidden;transition:border-color 0.2s,transform 0.2s;}
    .award-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac,linear-gradient(90deg,#f59e0b,#fbbf24));}
    .award-card.win{border-color:rgba(245,158,11,0.22);}
    .award-card:hover{transform:translateY(-1px);border-color:rgba(245,158,11,0.38);}
    .award-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:14px;}
    .award-title-wrap{flex:1;}
    .award-event{font-size:16px;font-weight:700;color:#eef2ff;margin-bottom:5px;line-height:1.3;}
    .award-project{font-size:13.5px;color:#fbbf24;font-weight:600;margin-bottom:0;}
    .award-badge{font-size:11px;font-weight:800;padding:5px 14px;border-radius:20px;border:1px solid;text-transform:uppercase;letter-spacing:0.5px;flex-shrink:0;white-space:nowrap;}
    .badge-gold{border-color:rgba(245,158,11,0.5);color:#fbbf24;background:rgba(245,158,11,0.12);}
    .badge-part{border-color:#1e2840;color:#3d4a6a;background:transparent;}
    .badge-papers{border-color:rgba(6,182,212,0.45);color:#06b6d4;background:rgba(6,182,212,0.1);}
    .award-desc{font-size:14px;color:#a0aec0;line-height:1.75;margin-top:10px;}
    .award-year{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#4a5568;margin-top:12px;}

    /* ── Experience ──────────────────────────────────────── */
    .exp-timeline{display:flex;flex-direction:column;gap:16px;}
    .exp-card{background:rgba(12,16,32,0.7);border:1px solid #1e2840;border-radius:14px;padding:22px 24px;transition:border-color 0.2s;position:relative;overflow:hidden;}
    .exp-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#8b5cf6,#6366f1);}
    .exp-card:hover{border-color:#2d3a5a;}
    .exp-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:flex-start;}
    .exp-role{font-size:17px;font-weight:700;color:#eef2ff;line-height:1.3;}
    .exp-co{font-size:13.5px;color:#818cf8;font-weight:600;margin-top:4px;}
    .exp-period{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#4a5568;background:#070a16;border:1px solid #1e2840;padding:4px 12px;border-radius:6px;align-self:flex-start;white-space:nowrap;}
    .exp-desc{font-size:14px;color:#a0aec0;line-height:1.8;margin-top:10px;}
    .exp-desc li{margin-bottom:7px;}
    .exp-stack{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
    .etag{background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.2);color:#818cf8;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:6px;}

    /* ── Education ───────────────────────────────────────── */
    .edu-list{display:flex;flex-direction:column;gap:16px;}
    .edu-card{background:rgba(12,16,32,0.7);border:1px solid #1e2840;border-radius:14px;padding:22px 24px;position:relative;overflow:hidden;}
    .edu-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#6366f1,#06b6d4);}
    .edu-school{font-size:18px;font-weight:800;color:#eef2ff;margin-bottom:5px;line-height:1.3;}
    .edu-deg{font-size:14px;color:#818cf8;font-weight:600;margin-bottom:5px;}
    .edu-year{font-family:'JetBrains Mono',monospace;font-size:12px;color:#4a5568;margin-bottom:16px;}
    .edu-tags{display:flex;flex-wrap:wrap;gap:7px;}
    .eutag{background:#070a16;border:1px solid #1e2840;color:#7c88a8;font-size:12px;padding:5px 11px;border-radius:6px;}

    /* ── Hint ────────────────────────────────────────────── */
    #hint{
      position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
      background:rgba(12,16,32,0.88);border:1px solid rgba(255,255,255,0.05);
      color:#3d4a6a;font-size:12px;font-weight:500;
      padding:7px 18px;border-radius:20px;
      pointer-events:none;z-index:100;
      transition:opacity 0.4s;backdrop-filter:blur(8px);
    }
    #hint.hide{opacity:0;}

    /* ── Sig ─────────────────────────────────────────────── */
    #sig{
      position:fixed;top:18px;left:24px;z-index:200;
      font-size:14px;font-weight:900;color:#eef2ff;letter-spacing:-0.5px;
      pointer-events:none;
    }
    #sig em{color:#818cf8;font-style:normal;}

    /* ── Legend ──────────────────────────────────────────── */
    #legend{
      position:fixed;left:24px;top:50%;transform:translateY(-50%);
      z-index:200;display:flex;flex-direction:column;gap:10px;
      pointer-events:none;
    }
    .leg-section{font-size:9.5px;font-weight:800;color:#9ca3af;
      text-transform:uppercase;letter-spacing:1.2px;margin-bottom:2px;}
    .leg-item{
      display:flex;align-items:center;gap:9px;
      font-size:12px;font-weight:600;color:#6b7280;
      transition:color 0.2s;
      pointer-events:auto;cursor:pointer;
    }
    .leg-item:hover{color:#c4cde8;}
    .leg-dot{
      width:9px;height:9px;border-radius:50%;flex-shrink:0;
      box-shadow:0 0 6px var(--ldc,transparent);
    }
    .leg-back{
      display:flex;align-items:center;gap:7px;
      font-size:11.5px;font-weight:700;color:#6366f1;
      background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.18);
      padding:7px 13px;border-radius:10px;cursor:pointer;
      pointer-events:auto;transition:all 0.2s;margin-bottom:6px;
    }
    .leg-back:hover{background:rgba(99,102,241,0.16);color:#4338ca;}
    /* ── Legend detail mode (planet view) ────────── */
    #legend.leg-detail{max-width:250px;}
    .leg-summary{
      font-size:11px;color:#7c88a8;line-height:1.6;
      margin-top:4px;margin-bottom:2px;
      border-left:2px solid rgba(255,255,255,0.1);
      padding-left:8px;
    }
    .leg-item-d{align-items:flex-start;gap:10px;flex-direction:row;padding:6px 0;cursor:pointer;}
    .leg-item-text{display:flex;flex-direction:column;gap:3px;}
    .leg-name{font-size:12px;font-weight:700;color:#c4cde8;line-height:1.2;}
    .leg-desc{font-size:10.5px;font-weight:400;color:#6b7280;line-height:1.4;}

    /* ── PDF embed view ─────────────────────────────────── */
    .pdf-embed-wrap{display:flex;flex-direction:column;height:100%;gap:0;}
    .pdf-embed-header{
      flex-shrink:0;padding-bottom:14px;margin-bottom:14px;
      border-bottom:1px solid rgba(255,255,255,0.05);
    }
    .pdf-embed-frame{
      flex:1;min-height:0;width:100%;
      border:none;border-radius:10px;
      background:#0a0d1c;
    }
    .card-body.pdf-embed{
      padding:20px 24px;overflow:hidden;
      display:flex;flex-direction:column;
    }

    /* ── Paper detail view ───────────────────────────────── */
    .paper-detail{display:flex;flex-direction:column;gap:22px;}
    .paper-detail-left{}
    .paper-detail-right{display:flex;flex-direction:column;gap:14px;}

    .pd-venue-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
    .pd-venue{font-size:12px;font-weight:700;color:#06b6d4;text-transform:uppercase;letter-spacing:0.6px;}
    .pd-dot{color:#1e2840;}
    .pd-year{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#3d4a6a;}

    .pd-title{font-size:18px;font-weight:800;color:#eef2ff;line-height:1.45;margin-bottom:14px;letter-spacing:-0.3px;}
    .pd-authors{font-size:12.5px;color:#818cf8;font-weight:500;line-height:1.7;margin-bottom:20px;}

    .pd-section-label{font-size:10px;font-weight:700;color:#3d4a6a;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
    .pd-abstract{font-size:13.5px;color:#94a3b8;line-height:1.85;margin-bottom:24px;}

    .pd-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;}

    .pd-read-btn{
      display:inline-flex;align-items:center;gap:9px;
      background:linear-gradient(135deg,rgba(6,182,212,0.15),rgba(6,182,212,0.06));
      border:1px solid rgba(6,182,212,0.35);
      color:#06b6d4;text-decoration:none;
      padding:13px 20px;border-radius:11px;
      font-family:inherit;font-size:13px;font-weight:700;
      transition:all 0.2s;width:100%;justify-content:center;
    }
    .pd-read-btn:hover{background:rgba(6,182,212,0.22);border-color:rgba(6,182,212,0.55);color:#67e8f9;}

    .pd-stat-box{background:#070a16;border:1px solid #161e30;border-radius:12px;padding:18px;}
    .pd-stat-label{font-size:10px;font-weight:700;color:#3d4a6a;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px;}
    .pd-stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #0d1220;}
    .pd-stat-row:last-child{border-bottom:none;}
    .pd-stat-key{font-size:11.5px;color:#7c88a8;}
    .pd-stat-val{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#eef2ff;font-weight:600;}

    .pd-highlight{background:rgba(99,102,241,0.07);border:1px solid rgba(99,102,241,0.18);border-radius:10px;padding:14px;}
    .pd-highlight-label{font-size:10px;font-weight:700;color:#818cf8;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px;}
    .pd-highlight-text{font-size:12.5px;color:#94a3b8;line-height:1.7;}

    /* ── Paper tabs ───────────────────────────────────────── */
    .ptabs{display:flex;gap:4px;margin-bottom:16px;flex-shrink:0;
      background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);
      border-radius:10px;padding:4px;}
    .ptab{flex:1;padding:8px 0;font-family:inherit;font-size:12px;font-weight:700;
      border:none;border-radius:7px;cursor:pointer;transition:all 0.2s;
      background:transparent;color:#6b7280;}
    .ptab.active{background:rgba(6,182,212,0.15);color:#06b6d4;
      box-shadow:0 1px 6px rgba(6,182,212,0.15);}
    .ptab:hover:not(.active){background:rgba(255,255,255,0.04);color:#94a3b8;}
    .ptab-panel{display:none;flex:1;min-height:0;}
    .ptab-panel.active{display:flex;flex-direction:column;}
    .ptab-overview{overflow-y:auto;flex-direction:column;gap:18px;
      scrollbar-width:thin;scrollbar-color:#1a2236 transparent;}

    /* ── Theme toggle button ─────────────────────────────── */
    #theme-toggle{
      position:fixed;top:16px;right:20px;z-index:200;
      background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
      color:#94a3b8;cursor:pointer;font-size:16px;
      width:36px;height:36px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      transition:all 0.2s;backdrop-filter:blur(8px);
    }
    #theme-toggle:hover{background:rgba(255,255,255,0.12);color:#eef2ff;}

    /* Light card (UI chrome only — canvas stays dark) */
    body.light #content-card{
      background:linear-gradient(to right,
        rgba(238,241,255,0) 0%,
        rgba(238,241,255,0.96) 14%,
        rgba(238,241,255,0.99) 100%);
      border-left-color:color-mix(in srgb,var(--nc) 30%,transparent);
    }
    body.light .card-topbar{background:rgba(0,0,0,0.02);border-bottom-color:rgba(0,0,0,0.06);}
    body.light .back-btn{background:rgba(99,102,241,0.08);border-color:rgba(99,102,241,0.2);color:#6366f1;}
    body.light .back-btn:hover{background:rgba(99,102,241,0.15);color:#4338ca;}
    body.light .card-title{color:#1e2030;}
    body.light .card-body{scrollbar-color:#d1d5db transparent;}
    body.light .about-name{color:#1e2030;}
    body.light .about-bio{color:#4b5563;}
    body.light .about-role{color:#6366f1;}
    body.light .loc-chip{background:#f3f4f6;border-color:#e5e7eb;color:#4b5563;}
    body.light .ast{background:#f9fafb;border-color:#e5e7eb;}
    body.light .ast-v{color:#1e2030;}
    body.light .ast-l{color:#6b7280;}
    body.light .alink{background:#f9fafb;border-color:#e5e7eb;color:#4b5563;}
    body.light .alink:hover{border-color:#6366f1;color:#1e2030;}
    body.light .paper-card{background:#f9fafb;border-color:#e5e7eb;}
    body.light .paper-card:hover{border-color:#c7d2fe;}
    body.light .paper-title{color:#1e2030;}
    body.light .paper-authors{color:#6366f1;}
    body.light .paper-venue{color:#9ca3af;}

// ── Helper functions ──────────────────────────────────────────────────────
function hexNum(hex){ return parseInt(hex.replace('#',''),16); }

function hexToRgba(hex,a){
  const h=hex.replace('#','');
  return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;
}

// ── Procedural canvas textures ────────────────────────────────────────────
const _texCache={};
const _texConfigs={
  edu:    {base:'#041e17',bands:['#10b981','#059669','#0d9488','#0f766e','#1d4ed8','#065f46'],type:'ocean'},

};
function makePlanetTexture(key){
  if(_texCache[key]) return _texCache[key];
  const cfg=_texConfigs[key]; if(!cfg) return null;
  const S=256,c=document.createElement('canvas');
  c.width=c.height=S;
  const ctx=c.getContext('2d');
  ctx.fillStyle=cfg.base; ctx.fillRect(0,0,S,S);
  if(cfg.type==='gas'||cfg.type==='ocean'){
    const nB=cfg.type==='gas'?14:10;
    for(let i=0;i<nB;i++){
      const yB=(i/nB)*S, h=S/nB+4;
      const col=cfg.bands[i%cfg.bands.length];
      const alpha=0.38+Math.abs(Math.sin(i*1.3))*0.3;
      ctx.fillStyle=hexToRgba(col,alpha);
      ctx.beginPath();
      ctx.moveTo(0,yB+Math.sin(i*2.1)*9);
      ctx.bezierCurveTo(S/3,yB+Math.sin(i*1.5)*16,2*S/3,yB+Math.sin(i*2.7)*12,S,yB+Math.sin(i*1.9)*10);
      ctx.lineTo(S,yB+h+10); ctx.lineTo(0,yB+h+10); ctx.closePath(); ctx.fill();
    }
    if(cfg.spot){
      const grd=ctx.createRadialGradient(S*.65,S*.42,0,S*.65,S*.42,26);
      grd.addColorStop(0,'rgba(254,243,199,0.55)');
      grd.addColorStop(0.55,'rgba(251,191,36,0.25)');
      grd.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=grd;
      ctx.beginPath(); ctx.ellipse(S*.65,S*.42,24,15,0.15,0,Math.PI*2); ctx.fill();
    }
  } else if(cfg.type==='rocky'){
    for(let j=0;j<2200;j++){
      const px=Math.random()*S,py=Math.random()*S,pr=1+Math.random()*4;
      const col=cfg.bands[Math.floor(Math.random()*cfg.bands.length)];
      ctx.fillStyle=hexToRgba(col,0.2+Math.random()*0.35);
      ctx.beginPath(); ctx.arc(px,py,pr,0,Math.PI*2); ctx.fill();
    }
    for(let i=0;i<12;i++){
      const cx=15+Math.random()*(S-30),cy=15+Math.random()*(S-30),cr=5+Math.random()*14;
      const grd=ctx.createRadialGradient(cx-cr*.25,cy-cr*.25,0,cx,cy,cr);
      grd.addColorStop(0,'rgba(0,0,0,0.65)'); grd.addColorStop(0.65,'rgba(0,0,0,0.12)');
      grd.addColorStop(0.85,'rgba(220,200,255,0.1)'); grd.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
    }
  } else {
    for(let i=0;i<7;i++){
      const y=(i/7)*S,h=S/7;
      ctx.fillStyle=hexToRgba(cfg.bands[i%cfg.bands.length],0.32+Math.random()*0.22);
      ctx.fillRect(0,y,S,h);
    }
    for(let i=0;i<6;i++){
      const cx=10+Math.random()*(S-20),cy=10+Math.random()*(S-20),cr=3+Math.random()*8;
      const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,cr);
      grd.addColorStop(0,'rgba(0,0,0,0.5)'); grd.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
    }
  }
  const tex=new THREE.CanvasTexture(c);
  _texCache[key]=tex; return tex;
}

// ── Orbit trail arc (added as child of pivot, always trails behind planet) ─
function makeTrailArc(radius, hexColor){
  const N=52, arcLen=1.15;
  const positions=new Float32Array((N+1)*3);
  const colors=new Float32Array((N+1)*3);
  const col=new THREE.Color(hexNum(hexColor));
  for(let i=0;i<=N;i++){
    const t=i/N;
    const a=-(arcLen*(1-t)); // from -arcLen→0 (planet is always at angle 0 in pivot local space)
    positions[i*3]=Math.cos(a)*radius; positions[i*3+1]=0; positions[i*3+2]=Math.sin(a)*radius;
    colors[i*3]=col.r*t*0.85; colors[i*3+1]=col.g*t*0.85; colors[i*3+2]=col.b*t*0.85;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
  return new THREE.Line(geo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.6}));
}

function makeSolarCorona(){
  const N=240;
  const pos=new Float32Array(N*3),data=[];
  for(let i=0;i<N;i++){
    const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
    const life=Math.random(),r=1.35+life*2.6;
    pos[i*3]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.sin(ph)*Math.sin(th);
    pos[i*3+2]=r*Math.cos(ph);
    data.push({th,ph,life,speed:0.22+Math.random()*0.5});
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const pts=new THREE.Points(geo,new THREE.PointsMaterial({
    color:0xff9030,size:0.09,transparent:true,opacity:0.8,
    blending:THREE.AdditiveBlending,depthWrite:false
  }));
  pts.userData.cd=data;
  return pts;
}

    color:0x8899aa,size:0.11,transparent:true,opacity:0.42,depthWrite:false
  }));
}

// ── Spawn a shooting star (added directly to scene, fades and is removed) ─
function spawnShootingStar(){
  const sx=(Math.random()-0.5)*120,sy=20+Math.random()*30,sz=(Math.random()-0.5)*60;
  const dx=(Math.random()-0.5)*0.4,dy=-(0.5+Math.random()*0.5),dz=(Math.random()-0.5)*0.3;
  const len=10+Math.random()*14;
  const dir=new THREE.Vector3(dx,dy,dz).normalize();
  const start=new THREE.Vector3(sx,sy,sz);
  const end=start.clone().addScaledVector(dir,len);
  const geo=new THREE.BufferGeometry().setFromPoints([start,end]);
  const mat=new THREE.LineBasicMaterial({color:0xe8eeff,transparent:true,opacity:0.85});
  const line=new THREE.Line(geo,mat);
  line.userData.life=1; line.userData.decay=0.6+Math.random()*0.5;
  scene.add(line); shootingStars.push(line);
}

// ── Spaceship system ──────────────────────────────────────────────────────
function makeSpaceship(){
  const g=new THREE.Group();
  const hullMat=new THREE.MeshPhongMaterial({color:0xbbd0ff,emissive:0x1133bb,emissiveIntensity:0.55,shininess:160});
  // Body — tip in +Z so lookAt(nextPos) points nose forward
  const hull=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.36,5),hullMat);
  hull.rotation.x=Math.PI/2;
  g.add(hull);
  // Side wings
  const wingMat=new THREE.MeshPhongMaterial({color:0x7788bb,emissive:0x0a1a55,emissiveIntensity:0.3,shininess:80});
  [-1,1].forEach(side=>{
    const w=new THREE.Mesh(new THREE.ConeGeometry(0.032,0.16,3),wingMat);
    w.rotation.z=side*Math.PI/2;
    w.position.set(side*0.1,0,-0.065);
    g.add(w);
  });
  // Engine exhaust glow (at the back, -Z)
  const ex=new THREE.Mesh(new THREE.SphereGeometry(0.062,8,8),
    new THREE.MeshBasicMaterial({color:0x4488ff,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));
  ex.position.z=-0.21;
  g.userData.exhaust=ex; g.add(ex);
  // Pre-allocated trail line (30 points, updated every frame)
  const TN=30,tp=new Float32Array(TN*3),tc=new Float32Array(TN*3);
  const tg=new THREE.BufferGeometry();
  tg.setAttribute('position',new THREE.BufferAttribute(tp,3));
  tg.setAttribute('color',new THREE.BufferAttribute(tc,3));
  g.userData.trailLine=new THREE.Line(tg,new THREE.LineBasicMaterial({
    vertexColors:true,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false}));
  g.userData.trailPts=[];
  return g;
}

function bezier3(p0,p1,p2,p3,t){
  const u=1-t;
  return p0.clone().multiplyScalar(u*u*u)
    .add(p1.clone().multiplyScalar(3*u*u*t))
    .add(p2.clone().multiplyScalar(3*u*t*t))
    .add(p3.clone().multiplyScalar(t*t*t));
}

function initShipRoute(ship,stagger=0){
  const keys=Object.keys(bodyMeshes).filter(k=>k!=='root'&&bodyMeshes[k]);
  if(keys.length<2){ship.userData.active=false;return;}
  const si=Math.floor(Math.random()*keys.length);
  let di; do{di=Math.floor(Math.random()*keys.length);}while(di===si);
  const s0=new THREE.Vector3(),d0=new THREE.Vector3();
  bodyMeshes[keys[si]].getWorldPosition(s0);
  bodyMeshes[keys[di]].getWorldPosition(d0);
  const dist=s0.distanceTo(d0);
  // Arc control points — curve up and out into space
  const arc=new THREE.Vector3(
    (Math.random()-.5)*dist*.5,
    (Math.random()*.35+.18)*dist,
    (Math.random()-.5)*dist*.5);
  ship.userData={...ship.userData,
    active:true, t:stagger, speed:.038+Math.random()*.03,
    srcPos:s0, dstKey:keys[di],
    cp1:s0.clone().add(arc),
    cp2:d0.clone().add(arc.clone().negate()),
    trailPts:[]};
  ship.position.copy(s0);
}

// ── City buildings with lit windows ──────────────────────────────────────
const _up3=new THREE.Vector3(0,1,0);
const _winTexPool=[];

function _buildWinTex(){
  const floors=4+Math.floor(Math.random()*7), cols=2+Math.floor(Math.random()*2);
  const W=64, H=floors*18;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,W,H);
  const wW=Math.floor(W/cols-5), wH=8;
  for(let row=0;row<floors;row++){
    for(let col=0;col<cols;col++){
      if(Math.random()>.25){ // 75% of windows lit
        const a=.55+Math.random()*.45;
        const warm=Math.random()>.3;
        ctx.fillStyle=warm
          ? `rgba(255,${Math.floor(205+50*a)},${Math.floor(70+70*a)},${a})`   // warm yellow/orange
          : `rgba(180,220,255,${a*.75})`;                                       // cool blue-white
        ctx.fillRect(col*(W/cols)+4, H-(row+1)*(H/floors)+4, wW, wH);
      }
    }
  }
  return new THREE.CanvasTexture(cv);
}
function getWinTex(){
  if(_winTexPool.length<10) _winTexPool.push(_buildWinTex());
  return _winTexPool[Math.floor(Math.random()*_winTexPool.length)];
}

const _bldgBodyColors=[0x1a2035,0x1e2d40,0x22303f,0x172030,0x1c2d3a,0x20283a];

function addCityCluster(parent,r,_unused,th,ph,n,s){
  for(let i=0;i<n;i++){
    const dth=(Math.random()-.5)*.28, dph=(Math.random()-.5)*.28;
    const tt=th+dth, pp=ph+dph;
    const nx=Math.sin(pp)*Math.cos(tt), ny=Math.cos(pp), nz=Math.sin(pp)*Math.sin(tt);
    const norm=new THREE.Vector3(nx,ny,nz).normalize();

    const h=(0.07+Math.random()*.1)*s;
    const w=(0.03+Math.random()*.028)*s;

    let geo;
    const style=i%4;
    if(style===0)      geo=new THREE.BoxGeometry(w,h,w);                  // office tower
    else if(style===1) geo=new THREE.BoxGeometry(w*.65,h*1.45,w*.65);     // slim highrise
    else if(style===2) geo=new THREE.BoxGeometry(w*1.7,h*.6,w*1.7);       // wide low-rise
    else               geo=new THREE.CylinderGeometry(w*.45,w*.65,h,6);   // round tower

    const mat=new THREE.MeshPhongMaterial({
      color:_bldgBodyColors[Math.floor(Math.random()*_bldgBodyColors.length)],
      emissive:0xffffff, emissiveIntensity:1.0,
      emissiveMap:getWinTex(),
      shininess:40
    });
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.copy(norm.clone().multiplyScalar(r+h/2));
    mesh.quaternion.setFromUnitVectors(_up3,norm);
    // Random axial spin so buildings don't all face the same way
    mesh.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(_up3, Math.random()*Math.PI*2));
    parent.add(mesh);

    // Rooftop navigation light on ~40% of taller buildings
    if(h>0.09*s && Math.random()>.55){
      const rtl=new THREE.Mesh(new THREE.SphereGeometry(.013*s,5,5),
        new THREE.MeshBasicMaterial({color:0xff3311,transparent:true,opacity:.95,
          blending:THREE.AdditiveBlending,depthWrite:false}));
      rtl.position.copy(norm.clone().multiplyScalar(r+h+.014*s));
      parent.add(rtl);
    }
  }
}

function addCities(parent,r,hexColor,s=1){
  const t1=Math.random()*Math.PI*2, p1=.28+Math.random()*.22;
  const t2=t1+Math.PI*.75+Math.random()*.8, p2=Math.PI*.52+Math.random()*.22;
  addCityCluster(parent,r,hexColor,t1,p1,10,s);
  addCityCluster(parent,r,hexColor,t2,p2, 7,s);
}

// ── Planet terrain: mountains, volcanoes, water, ice ─────────────────────
const TERRAIN_CFG={
  edu:    {mtn:5, mtnCol:0x2d6a2d, mtnH:[.07,.16], mtnW:[.04,.09], snowCap:true,  vol:0, water:4, ice:2},
  papers: {mtn:8, mtnCol:0xc8e8ff, mtnH:[.09,.2],  mtnW:[.022,.06],snowCap:false, vol:0, water:0, ice:5},
  awards: {mtn:4, mtnCol:0x5c2c08, mtnH:[.1,.22],  mtnW:[.05,.1],  snowCap:false, vol:4, water:0, ice:0},
  exp:    {mtn:5, mtnCol:0x3c1f5c, mtnH:[.08,.18], mtnW:[.04,.09], snowCap:false, vol:4, water:0, ice:0},
};

function _norm(th,ph){ return new THREE.Vector3(Math.sin(ph)*Math.cos(th),Math.cos(ph),Math.sin(ph)*Math.sin(th)).normalize(); }

function _addMountain(parent,r,th,ph,h,w,col,snow,s){
  const norm=_norm(th,ph);
  const mesh=new THREE.Mesh(new THREE.ConeGeometry(w*s,h*s,7),
    new THREE.MeshPhongMaterial({color:col,shininess:18}));
  mesh.position.copy(norm.clone().multiplyScalar(r+(h*s)/2));
  mesh.quaternion.setFromUnitVectors(_up3,norm);
  parent.add(mesh);
  if(snow && h>.09){
    const capH=h*.28*s;
    const cap=new THREE.Mesh(new THREE.ConeGeometry(w*.38*s,capH,7),
      new THREE.MeshPhongMaterial({color:0xeef5ff,shininess:55}));
    cap.position.copy(norm.clone().multiplyScalar(r+h*s-capH*.45));
    cap.quaternion.setFromUnitVectors(_up3,norm);
    parent.add(cap);
  }
}

function _addVolcano(parent,r,th,ph,h,w,s){
  const norm=_norm(th,ph);
  const crR=w*.32;
  // Main cone
  const body=new THREE.Mesh(new THREE.CylinderGeometry(crR*s,w*s,h*s,8),
    new THREE.MeshPhongMaterial({color:0x2a1008,emissive:0x180500,emissiveIntensity:.35,shininess:8}));
  body.position.copy(norm.clone().multiplyScalar(r+(h*s)/2));
  body.quaternion.setFromUnitVectors(_up3,norm);
  parent.add(body);
  // Lava crater — registered in glowRefs so it pulses
  const lavaPos=norm.clone().multiplyScalar(r+h*s+crR*s*.28);
  const lava=new THREE.Mesh(new THREE.SphereGeometry(crR*s*.88,8,8),
    new THREE.MeshBasicMaterial({color:0xff4400,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
  lava.position.copy(lavaPos);
  parent.add(lava);
  glowRefs.push({shell:lava,baseOpacity:.72,amp:.28,freq:1.6+Math.random()*.6,phase:Math.random()*Math.PI*2});
  // Halo glow
  const halo=new THREE.Mesh(new THREE.SphereGeometry(crR*s*2.4,6,6),
    new THREE.MeshBasicMaterial({color:0xff6600,transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false}));
  halo.position.copy(lavaPos);
  parent.add(halo);
  glowRefs.push({shell:halo,baseOpacity:.1,amp:.12,freq:0.8,phase:Math.random()*Math.PI*2});
  // Smoke wisp
  const smoke=new THREE.Mesh(new THREE.SphereGeometry(crR*s*1.3,6,6),
    new THREE.MeshBasicMaterial({color:0x282828,transparent:true,opacity:.2,blending:THREE.NormalBlending,depthWrite:false}));
  smoke.position.copy(norm.clone().multiplyScalar(r+h*s+crR*s*2.0));
  parent.add(smoke);
  glowRefs.push({shell:smoke,baseOpacity:.15,amp:.1,freq:0.45,phase:Math.random()*Math.PI*2});

  // ── Eruption particle emitter ─────────────────────────────────────────
  const N=55;
  const ptPos=new Float32Array(N*3);
  const craterTop=norm.clone().multiplyScalar(r+h*s); // in parent-local space
  for(let i=0;i<N;i++){
    ptPos[i*3]=craterTop.x; ptPos[i*3+1]=craterTop.y; ptPos[i*3+2]=craterTop.z;
  }
  const pGeo=new THREE.BufferGeometry();
  pGeo.setAttribute('position',new THREE.BufferAttribute(ptPos,3));
  const epts=new THREE.Points(pGeo,new THREE.PointsMaterial({
    color:0xff5500,size:0.024*s,transparent:true,opacity:.82,
    blending:THREE.AdditiveBlending,depthWrite:false
  }));
  // Store all per-particle data in userData
  epts.userData.ed={
    craterTop,norm:norm.clone(),
    life:Float32Array.from({length:N},()=>Math.random()),
    speed:Float32Array.from({length:N},()=>0.28+Math.random()*.3),
    spread:Float32Array.from({length:N*3},()=>(Math.random()-.5)*.14*s),
    maxH:(0.22+Math.random()*.15)*s,
  };
  parent.add(epts);
  eruptionSystems.push(epts);

  // Ash particle emitter (larger, slower, darker)
  const ashPos=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    ashPos[i*3]=craterTop.x; ashPos[i*3+1]=craterTop.y; ashPos[i*3+2]=craterTop.z;
  }
  const aGeo=new THREE.BufferGeometry();
  aGeo.setAttribute('position',new THREE.BufferAttribute(ashPos,3));
  const ash=new THREE.Points(aGeo,new THREE.PointsMaterial({
    color:0x554433,size:0.035*s,transparent:true,opacity:.45,
    blending:THREE.NormalBlending,depthWrite:false
  }));
  ash.userData.ed={
    craterTop,norm:norm.clone(),
    life:Float32Array.from({length:N},()=>Math.random()),
    speed:Float32Array.from({length:N},()=>0.12+Math.random()*.15),
    spread:Float32Array.from({length:N*3},()=>(Math.random()-.5)*.22*s),
    maxH:(0.38+Math.random()*.2)*s,
  };
  parent.add(ash);
  eruptionSystems.push(ash);
}

function _addWater(parent,r,th,ph,w,s){
  const norm=_norm(th,ph);
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(w*s,w*s,0.009*s,12),
    new THREE.MeshPhongMaterial({color:0x0066bb,emissive:0x001e44,emissiveIntensity:.5,
      transparent:true,opacity:.78,shininess:110}));
  mesh.position.copy(norm.clone().multiplyScalar(r+.005*s));
  mesh.quaternion.setFromUnitVectors(_up3,norm);
  parent.add(mesh);
  glowRefs.push({shell:mesh,baseOpacity:.68,amp:.18,freq:.55+Math.random()*.25,phase:Math.random()*Math.PI*2});
}

function _addIce(parent,r,th,ph,w,s){
  const norm=_norm(th,ph);
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(w*s,w*s*1.12,0.011*s,9),
    new THREE.MeshPhongMaterial({color:0xddf2ff,emissive:0x7799bb,emissiveIntensity:.25,
      transparent:true,opacity:.88,shininess:85}));
  mesh.position.copy(norm.clone().multiplyScalar(r+.006*s));
  mesh.quaternion.setFromUnitVectors(_up3,norm);
  parent.add(mesh);
}

function addTerrain(parent,key,r,s){
  const cfg=TERRAIN_CFG[key]; if(!cfg) return;
  // Mountains
  for(let i=0;i<cfg.mtn;i++){
    const th=Math.random()*Math.PI*2;
    const ph=Math.PI*.2+Math.random()*Math.PI*.6;
    const h=cfg.mtnH[0]+Math.random()*(cfg.mtnH[1]-cfg.mtnH[0]);
    const w=cfg.mtnW[0]+Math.random()*(cfg.mtnW[1]-cfg.mtnW[0]);
    _addMountain(parent,r,th,ph,h,w,cfg.mtnCol,cfg.snowCap,s);
  }
  // Volcanoes
  for(let i=0;i<cfg.vol;i++){
    const th=Math.random()*Math.PI*2;
    const ph=Math.PI*.25+Math.random()*Math.PI*.5;
    _addVolcano(parent,r,th,ph,.1+Math.random()*.12,.055+Math.random()*.055,s);
  }
  // Water bodies
  for(let i=0;i<cfg.water;i++){
    const th=Math.random()*Math.PI*2;
    const ph=Math.PI*.3+Math.random()*Math.PI*.4;
    _addWater(parent,r,th,ph,.1+Math.random()*.14,s);
  }
  // Ice patches (near poles)
  for(let i=0;i<cfg.ice;i++){
    const th=Math.random()*Math.PI*2;
    const ph=i<cfg.ice/2 ? Math.random()*.22 : Math.PI-Math.random()*.22;
    _addIce(parent,r,th,ph,.1+Math.random()*.1,s);
  }
}

// ── Clouds (children of planet, drift with self-spin, opacity animated) ───
const CLOUD_CFGS={
  edu:    {color:0xddf5ff, count:6,  alt:.065, op:.4,  puffR:.055}, // white ocean clouds
  papers: {color:0xe8f6ff, count:5,  alt:.055, op:.32, puffR:.042}, // thin ice-crystal wisps
  awards: {color:0xffc060, count:7,  alt:.075, op:.38, puffR:.058}, // amber storm clouds
  exp:    {color:0x9977bb, count:4,  alt:.06,  op:.3,  puffR:.045}, // purple volcanic haze
};

function _makeCloudPuff(r,th,ph,cfg,s){
  const norm=_norm(th,ph);
  const group=new THREE.Group();
  group.position.copy(norm.clone().multiplyScalar(r+cfg.alt*s*1.4));
  group.quaternion.setFromUnitVectors(_up3,norm);
  // Multiple overlapping spheres per cloud for a fluffy look
  const layout=[[0,0,0,1],[.85,0.2,0,.78],[-.7,0.15,.35,.68],[.15,.35,-.6,.6],[-.3,.4,.5,.55]];
  layout.forEach(([ox,oy,oz,sc],i)=>{
    const pr=cfg.puffR*sc*s;
    const puff=new THREE.Mesh(new THREE.SphereGeometry(pr,6,6),
      new THREE.MeshPhongMaterial({color:cfg.color,transparent:true,opacity:cfg.op*(1-i*.08),
        depthWrite:false,shininess:5}));
    puff.position.set(ox*cfg.puffR*s*1.1, oy*cfg.puffR*s*0.7, oz*cfg.puffR*s*1.1);
    group.add(puff);
    glowRefs.push({shell:puff,baseOpacity:cfg.op*(1-i*.08),amp:cfg.op*.3,
      freq:.22+i*.07+Math.random()*.1,phase:Math.random()*Math.PI*2});
  });
  return group;
}

function addClouds(planet,key,r,s){
  const cfg=CLOUD_CFGS[key]; if(!cfg) return;
  for(let i=0;i<cfg.count;i++){
    const th=Math.random()*Math.PI*2;
    const ph=Math.PI*.18+Math.random()*Math.PI*.64; // avoid exact poles
    planet.add(_makeCloudPuff(r,th,ph,cfg,s));
  }
}

function makeSphere(radius, hexColor, emissiveInt=0, shininess=40, texKey=null){

function makePlanetRing(innerR, outerR, hexColor, tiltDeg=28){
  const geo = new THREE.RingGeometry(innerR, outerR, 64);
  const mat = new THREE.MeshBasicMaterial({
    color:hexNum(hexColor), side:THREE.DoubleSide,
    transparent:true, opacity:0.55
  });

function makeGlowShell(radius, hexColor, opacity=0.12){

    new THREE.SphereGeometry(radius,16,16),
    new THREE.MeshBasicMaterial({color:hexNum(hexColor),transparent:true,opacity,side:THREE.BackSide})

}
// animated version — registers for pulsing in the render loop
function makeAnimGlow(radius,hexColor,opacity,freq,phase){
  const shell=makeGlowShell(radius,hexColor,opacity);
  glowRefs.push({shell,baseOpacity:opacity,amp:opacity*0.45,freq,phase});

}

function makeOrbitRing(radius, tiltDeg, hexColor){
  const pts=[];
  for(let i=0;i<=128;i++){
    const a=(i/128)*Math.PI*2;
    pts.push(new THREE.Vector3(Math.cos(a)*radius,0,Math.sin(a)*radius));
  }
  const line=new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:hexNum(hexColor),transparent:true,opacity:0.22})
  );
  line.rotation.x=(tiltDeg*Math.PI)/180;
  return line;
}

function makeWaterSphere(r, key, scaleFactor){
  const cfg=WATER_CFGS[key]; if(!cfg) return null;
  const s=scaleFactor||1;
  const group=new THREE.Group();

  // ── Solid glow layer ──────────────────────────────────────────────────────
  const geoS=new THREE.SphereGeometry(r*1.005,36,36);
  const origS=new Float32Array(geoS.attributes.position.array);
  const matS=new THREE.MeshPhongMaterial({
    color:cfg.color, emissive:cfg.emissive, emissiveIntensity:cfg.emissiveInt*0.8,
    transparent:true, opacity:cfg.op*0.45, shininess:80, depthWrite:false,
  });
  const meshS=new THREE.Mesh(geoS,matS);
  meshS.userData.origPos=origS;
  waterRefs.push({mesh:meshS, amp:cfg.amp*s, freq:cfg.freq, spd:cfg.spd});
  group.add(meshS);

  // ── Fine outer wireframe (spins forward) ─────────────────────────────────
  const geoW=new THREE.SphereGeometry(r*1.022,28,28);
  const origW=new Float32Array(geoW.attributes.position.array);
  const matW=new THREE.MeshBasicMaterial({
    color:cfg.color, wireframe:true, transparent:true, opacity:0.70, depthWrite:false,
  });
  const meshW=new THREE.Mesh(geoW,matW);
  meshW.userData.origPos=origW;
  waterRefs.push({mesh:meshW, amp:cfg.amp*s*1.3, freq:cfg.freq, spd:cfg.spd*1.1, spinRate:0.12});
  group.add(meshW);

  // ── Coarse inner wireframe (counter-spins for 3D depth) ──────────────────
  const geoW2=new THREE.SphereGeometry(r*1.011,14,14);
  const origW2=new Float32Array(geoW2.attributes.position.array);
  const matW2=new THREE.MeshBasicMaterial({
    color:cfg.color, wireframe:true, transparent:true, opacity:0.28, depthWrite:false,
  });
  const meshW2=new THREE.Mesh(geoW2,matW2);
  meshW2.userData.origPos=origW2;
  waterRefs.push({mesh:meshW2, amp:cfg.amp*s*0.9, freq:cfg.freq*1.2, spd:cfg.spd*0.7, spinRate:-0.07});
  group.add(meshW2);

  return group;
}

// ── Build root scene ──────────────────────────────────────────────────────
const PLANET_TILT_AX={edu:8,papers:-14,awards:11,exp:-6}; // axial tilt degrees
const PLANET_GLOW_FREQ={edu:0.6,papers:0.85,awards:0.5,exp:0.7};

function buildRootScene(){
  clearWorld();

  // asteroid belt + corona live in worldGroup so they clear on planet-view switch
  asteroidBeltRef=makeAsteroidBelt(); worldGroup.add(asteroidBeltRef);
  coronaRef=makeSolarCorona(); worldGroup.add(coronaRef);

  const sun=makeSphere(1.35,'#6366f1',0.55);
  sun.userData={key:'root',type:'sun',selfSpin:SUN_SPIN};
  sun.add(makeAnimGlow(1.9,'#6366f1',0.22,1.1,0));
  sun.add(makeAnimGlow(2.9,'#6366f1',0.07,0.7,1.2));
  const sunLbl=makeLabel('Bharani\nNammi',2.1);
  sun.add(sunLbl); labelObjs['root']=sunLbl;
  sunLbl.element.classList.add('visible');
  worldGroup.add(sun); bodyMeshes['root']=sun;

  Object.entries(PLANET_ORBITS).forEach(([key,orb],pi)=>{
    const nd=NODES[key];
    worldGroup.add(makeOrbitRing(orb.r, orb.tilt, nd.color));

    const pivot=new THREE.Object3D();
    pivot.rotation.x=(orb.tilt*Math.PI)/180;
    pivot.rotation.y=orb.startAng;
    pivot.userData.orbitSpeed=orb.speed;
    worldGroup.add(pivot); pivots[key]=pivot;

    // trail arc — child of pivot so it auto-follows orbital motion
    pivot.add(makeTrailArc(orb.r, nd.color));

    const sz=PLANET_SIZES[key]||0.55;
    const planet=makeSphere(sz, nd.color, 0.28, PLANET_SHINE[key]||40, key);
    planet.position.set(orb.r,0,0);
    planet.rotation.z=(PLANET_TILT_AX[key]||0)*Math.PI/180;
    planet.userData={key,type:'planet'};
    if(key==='exp') planet.add(makePlanetRing(sz*1.35, sz*2.1, nd.color, 30));
    const water=makeWaterSphere(sz, key, sz/0.42);
    if(water) planet.add(water);
    pivot.add(planet); bodyMeshes[key]=planet;

    const lbl=makeLabel(nd.label, sz+0.55);
    planet.add(lbl); labelObjs[key]=lbl;
  });

  // Spaceships — create once, re-add to worldGroup each root build
  if(ships.length===0){
    for(let i=0;i<SHIP_N;i++) ships.push(makeSpaceship());
  }
  ships.forEach((s,i)=>{
    worldGroup.add(s);
    worldGroup.add(s.userData.trailLine);
    initShipRoute(s, i/SHIP_N); // stagger so ships are spread across their journeys
  });
}

// ── Build planet scene ────────────────────────────────────────────────────
function buildPlanetScene(planetKey){
  clearWorld();
  const nd=NODES[planetKey];
  const moonList=MOON_ORBITS[planetKey]||[];

  const planet=makeSphere(0.95,nd.color,0.38,60,planetKey);
  planet.userData={key:planetKey,type:'planet-center',selfSpin:PLANET_SPIN[planetKey]||0.2};
  planet.rotation.z=(PLANET_TILT_AX[planetKey]||0)*Math.PI/180;
  const waterP=makeWaterSphere(0.95, planetKey, 2.0);
  if(waterP) planet.add(waterP);
  const pLbl=makeLabel(nd.label,1.5);
  planet.add(pLbl); labelObjs[planetKey]=pLbl;
  pLbl.element.classList.add('visible');
  worldGroup.add(planet); bodyMeshes[planetKey]=planet;

  const moonSzBase=[0.33,0.26,0.30];
  const moonSpinBase=[0.65,1.0,0.5];
  const moonFreqs=[0.9,1.2,0.7];
  moonList.forEach((m,mi)=>{
    const mn=NODES[m.key];
    const sz=moonSzBase[mi%moonSzBase.length];
    worldGroup.add(makeOrbitRing(m.r,0,mn.color));

    const pivot=new THREE.Object3D();
    pivot.rotation.y=m.startAng;
    pivot.userData.orbitSpeed=m.speed;
    worldGroup.add(pivot); pivots[m.key]=pivot;

    // trail arc on each moon
    pivot.add(makeTrailArc(m.r, mn.color));

    const moon=makeSphere(sz,mn.color,0.35,70,m.key);
    moon.position.set(m.r,0,0);
    moon.userData={key:m.key,type:'moon',selfSpin:moonSpinBase[mi%moonSpinBase.length]};
    moon.add(makeAnimGlow(sz*1.65,mn.color,0.30,moonFreqs[mi%moonFreqs.length],mi*1.1));
    pivot.add(moon); bodyMeshes[m.key]=moon;

    const lbl=makeLabel(mn.label,sz+0.45);
    moon.add(lbl); labelObjs[m.key]=lbl;
  });
}

// ── View switching ────────────────────────────────────────────────────────
let viewState='root';
const container=document.getElementById('three-container');

function switchView(key){
  hoveredKey=null;
  renderer.domElement.style.cursor='grab';
  container.style.opacity='0';
  setTimeout(()=>{
    introActive=false; controls.enabled=true; // ensure controls are live after any transition
    viewState=key;
    if(key==='root'){
      buildRootScene();
      camera.position.set(0,12,26);
      controls.target.set(0,0,0);
    } else {
      buildPlanetScene(key);
      camera.position.set(0,6,12);
      controls.target.set(0,0,0);
    }
    controls.update();
    updateLegend();
    requestAnimationFrame(()=>{ container.style.opacity='1'; });
  },300);
}
window.switchView=switchView;

// ── Hover + click ─────────────────────────────────────────────────────────
const raycaster=new THREE.Raycaster();
const mouse2=new THREE.Vector2();
let hoveredKey=null;

function getClickables(){ return Object.values(bodyMeshes); }

renderer.domElement.addEventListener('mousemove',e=>{
  const r=renderer.domElement.getBoundingClientRect();
  mouse2.x=((e.clientX-r.left)/r.width)*2-1;
  mouse2.y=-((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouse2,camera);
  const hits=raycaster.intersectObjects(getClickables(),true);
  let newKey=null;
  if(hits.length){
    let obj=hits[0].object;
    while(obj && !obj.userData.key) obj=obj.parent;
    if(obj) newKey=obj.userData.key;
  }
  if(newKey!==hoveredKey){
    if(hoveredKey && labelObjs[hoveredKey] && !labelObjs[hoveredKey].element.classList.contains('always-visible')){
      labelObjs[hoveredKey].element.classList.remove('visible');
    }
    hoveredKey=newKey;
    if(hoveredKey && labelObjs[hoveredKey]){
      labelObjs[hoveredKey].element.classList.add('visible');
    }
    renderer.domElement.style.cursor=hoveredKey?'pointer':'grab';
  }
});

let mdPos={x:0,y:0};
renderer.domElement.addEventListener('mousedown',e=>{mdPos={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('click',e=>{
  if(Math.hypot(e.clientX-mdPos.x,e.clientY-mdPos.y)>5) return;
  const r=renderer.domElement.getBoundingClientRect();
  mouse2.x=((e.clientX-r.left)/r.width)*2-1;
  mouse2.y=-((e.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(mouse2,camera);
  const hits=raycaster.intersectObjects(getClickables(),true);
  if(!hits.length) return;
  let obj=hits[0].object;
  while(obj && !obj.userData.key) obj=obj.parent;
  if(!obj) return;
  const {key,type}=obj.userData;
  if(type==='sun') openCard('root','root');
  else if(type==='planet'&&MOON_ORBITS[key]) switchView(key);
  else if(type==='planet') openCard(key,key);
  else if(type==='moon') openCard(key,key);
  else if(type==='planet-center') openCard(key,key);
});

// ── Animate loop ──────────────────────────────────────────────────────────
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const d=clock.getDelta();
  const t=clock.getElapsedTime();

  // ── Camera fly-in intro ──────────────────────────────────────────────
  if(introActive){
    introT=Math.min(introT+d/INTRO_DUR,1);
    const ease=1-Math.pow(1-introT,4); // quartic ease-out
    camera.position.lerpVectors(new THREE.Vector3(0,38,82),introEndPos,ease);
    if(introT>=1){ introActive=false; controls.enabled=true; }
  }

  // ── Orbital revolution + self-spin ───────────────────────────────────
  Object.values(pivots).forEach(p=>{ p.rotation.y+=p.userData.orbitSpeed*d; });
  Object.values(bodyMeshes).forEach(mesh=>{
    const spin=mesh.userData.selfSpin??PLANET_SPIN[mesh.userData.key]??0;
    if(spin) mesh.rotation.y+=spin*d;
    if(mesh.userData.key==='root') mesh.rotation.y+=SUN_SPIN*d;
  });

  // ── Animated glow pulse ───────────────────────────────────────────────
  glowRefs.forEach(({shell,baseOpacity,amp,freq,phase})=>{
    shell.material.opacity=baseOpacity+amp*Math.sin(t*freq+phase);
  });

  // ── Volcano eruption particles ────────────────────────────────────────
  eruptionSystems.forEach(pts=>{
    const {craterTop,norm,life,speed,spread,maxH}=pts.userData.ed;
    const pa=pts.geometry.attributes.position;
    for(let i=0;i<life.length;i++){
      life[i]=(life[i]+speed[i]*d)%1;
      const arc=Math.sin(life[i]*Math.PI)*maxH; // parabolic arc: 0→peak→0
      pa.setXYZ(i,
        craterTop.x+norm.x*arc+spread[i*3]  *life[i]*2,
        craterTop.y+norm.y*arc+spread[i*3+1]*life[i]*2,
        craterTop.z+norm.z*arc+spread[i*3+2]*life[i]*2
      );
    }
    pa.needsUpdate=true;
  });

  // ── Animated water surface (vertex displacement + wireframe spin) ────────
  waterRefs.forEach(({mesh,amp,freq,spd,spinRate})=>{
    if(spinRate) mesh.rotation.y+=spinRate*d;
    const pa=mesh.geometry.attributes.position;
    const orig=mesh.userData.origPos;
    const N=pa.count;
    for(let i=0;i<N;i++){
      const ox=orig[i*3],oy=orig[i*3+1],oz=orig[i*3+2];
      const len=Math.sqrt(ox*ox+oy*oy+oz*oz);
      const wave=
        Math.sin(ox*freq        + t*spd      )*Math.cos(oy*freq*.82  + t*spd*.75)*0.50+
        Math.sin(oy*freq*1.1    + t*spd*.90  )*Math.cos(oz*freq*.92  + t*spd*1.1)*0.32+
        Math.sin(oz*freq*1.3    + t*spd*1.2  )*Math.cos(ox*freq*.70  + t*spd*.60)*0.18;
      const sc=(len+wave*amp)/len;
      pa.setXYZ(i,ox*sc,oy*sc,oz*sc);
    }
    pa.needsUpdate=true;
  });

  // ── Solar corona particles ────────────────────────────────────────────
  if(coronaRef){
    const pa=coronaRef.userData.cd;
    const posAttr=coronaRef.geometry.attributes.position;
    for(let i=0;i<pa.length;i++){
      pa[i].life+=pa[i].speed*d*0.35;
      if(pa[i].life>1){ pa[i].life=0; pa[i].th=Math.random()*Math.PI*2; pa[i].ph=Math.acos(2*Math.random()-1); }
      const r=1.35+pa[i].life*2.7;
      posAttr.setXYZ(i,
        r*Math.sin(pa[i].ph)*Math.cos(pa[i].th),
        r*Math.sin(pa[i].ph)*Math.sin(pa[i].th),
        r*Math.cos(pa[i].ph));
    }
    posAttr.needsUpdate=true;
    coronaRef.material.opacity=0.7+0.15*Math.sin(t*1.8);
  }

  // ── Asteroid belt slow rotation ───────────────────────────────────────
  if(asteroidBeltRef) asteroidBeltRef.rotation.y+=0.00008;

  // ── Shooting stars ────────────────────────────────────────────────────
  if(t>nextShotTime){ spawnShootingStar(); nextShotTime=t+9+Math.random()*14; }
  for(let i=shootingStars.length-1;i>=0;i--){
    const s=shootingStars[i];
    s.userData.life-=s.userData.decay*d;
    s.material.opacity=Math.max(0,s.userData.life*0.85);
    if(s.userData.life<=0){ scene.remove(s); s.geometry.dispose(); s.material.dispose(); shootingStars.splice(i,1); }
  }

  // ── Spaceships (root view only) ───────────────────────────────────────
  if(viewState==='root'){
    const _tv=new THREE.Vector3();
    ships.forEach(ship=>{
      if(!ship.userData.active) return;
      const dstMesh=bodyMeshes[ship.userData.dstKey];
      if(!dstMesh){ initShipRoute(ship); return; }
      ship.userData.t=Math.min(ship.userData.t+ship.userData.speed*d,1);
      dstMesh.getWorldPosition(_tv);
      const tt=ship.userData.t, tN=Math.min(tt+.009,1);
      const pos=bezier3(ship.userData.srcPos,ship.userData.cp1,ship.userData.cp2,_tv,tt);
      const posN=bezier3(ship.userData.srcPos,ship.userData.cp1,ship.userData.cp2,_tv,tN);
      ship.position.copy(pos);
      if(posN.distanceTo(pos)>1e-4) ship.lookAt(posN);
      // Engine exhaust pulse
      if(ship.userData.exhaust){
        ship.userData.exhaust.material.opacity=0.75+0.28*Math.sin(t*15+tt*35);
        ship.userData.exhaust.scale.setScalar(0.8+0.45*Math.sin(t*11+tt*20));
      }
      // Update trail buffer
      ship.userData.trailPts.unshift(pos.clone());
      if(ship.userData.trailPts.length>29) ship.userData.trailPts.pop();
      const tl=ship.userData.trailLine;
      if(tl){
        const pa=tl.geometry.attributes.position,ca=tl.geometry.attributes.color;
        const NN=pa.count,col=new THREE.Color(0x3377ff);
        for(let j=0;j<NN;j++){
          const pt=ship.userData.trailPts[j]||pos;
          const a=Math.max(0,(1-j/NN)*0.65);
          pa.setXYZ(j,pt.x,pt.y,pt.z);
          ca.setXYZ(j,col.r*a,col.g*a,col.b*a);
        }
        pa.needsUpdate=true; ca.needsUpdate=true;
      }
      if(ship.userData.t>=1) initShipRoute(ship);
    });
  }

  // ── Star slow drift ───────────────────────────────────────────────────
  stars.rotation.y+=0.000035;

  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}

// ── Legend ────────────────────────────────────────────────────────────────
function updateLegend(){
  const leg = document.getElementById('legend');
  if(viewState === 'root'){
    leg.className='';
    const cats = Object.entries(NODES).filter(([,n])=>n.type==='cat');
    leg.innerHTML = '<div class="leg-section">Explore</div>'
      + cats.map(([k,n])=>
        `<div class="leg-item" onclick="switchView('${k}')"><span class="leg-dot" style="background:${n.color}"></span>${n.label.replace('\n',' ')}</div>`
      ).join('');
  } else {
    leg.className='leg-detail';
    const pN = NODES[viewState];
    const ms = MOON_ORBITS[viewState]||[];
    const summaryHtml = pN.summary
      ? `<div class="leg-summary">${pN.summary}</div>` : '';
    leg.innerHTML =
      '<div class="leg-back" onclick="switchView(\'root\')">← Solar System</div>'
      +'<div class="leg-section">'+pN.label.replace('\n',' ')+'</div>'
      + summaryHtml
      +(ms.length ? '<div class="leg-section" style="margin-top:12px">In this orbit</div>' : '')
      + ms.map(m=>{
          const mn=NODES[m.key];
          return `<div class="leg-item leg-item-d" onclick="openCard('${m.key}','${m.key}')">
            <span class="leg-dot" style="background:${mn.color};flex-shrink:0"></span>
            <div class="leg-item-text">
              <div class="leg-name">${mn.label.replace('\n',' ')}</div>
              <div class="leg-desc">${mn.desc||''}</div>
            </div>
          </div>`;
        }).join('');
  }
}

// ── Card open / close ─────────────────────────────────────────────────────
let activeKey = null;

const NODE_TYPE_LABELS = { root:'About', cat:'Category', leaf:'Detail', papers:'Research', awards:'Award', exp:'Experience', edu:'Education', p1:'Paper', p2:'Paper', p3:'Paper', a1:'Award', a2:'Award' };

function openCard(key, clickedKey){
  const c = CONTENT[key];
  if(!c) return;
  // apply node color accent
  const nd = NODES[key];
  const nc = nd?.color || c.subColor || '#6366f1';
  const card = document.getElementById('content-card');
  card.style.setProperty('--nc', nc);
  document.getElementById('cTagText').textContent = NODE_TYPE_LABELS[key] || nd?.type || '';
  document.getElementById('cTitle').textContent = c.title;
  document.getElementById('cSub').textContent   = c.sub;
  document.getElementById('cSub').style.color   = c.subColor || '#7c88a8';
  const body = document.getElementById('cBody');
  body.innerHTML = c.html;
  // re-trigger animation by cloning class
  body.className = '';
  requestAnimationFrame(()=>{ body.className = c.pdfEmbed ? 'card-body pdf-embed' : 'card-body'; });
  document.getElementById('hint').classList.add('hide');
  document.body.classList.add('zoomed-in');
  activeKey = key;
}
window.openCard=openCard;

function closeCard(){
  document.body.classList.remove('zoomed-in');
  document.getElementById('cBody').className = 'card-body';
  document.getElementById('hint').classList.remove('hide');
  activeKey = null;
}

// ── Paper tab switcher ────────────────────────────────────────────────────
function switchPaperTab(panelId, btn){
  const wrap = btn.closest('.pdf-embed-wrap');
  wrap.querySelectorAll('.ptab').forEach(t=>t.classList.remove('active'));
  wrap.querySelectorAll('.ptab-panel').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  wrap.querySelector('#'+panelId).classList.add('active');
}
window.switchPaperTab=switchPaperTab;

// ── Event listeners ───────────────────────────────────────────────────────
document.getElementById('backBtn').addEventListener('click', closeCard);
function applyTheme(isLight){
  if(isLight){
    renderer.setClearColor(0xdde4f5, 1);
    starMat.color.set(0x8899cc); starMat.opacity=0.18; starMat.size=0.10;
    ambientLight.color.set(0x99aabb); ambientLight.intensity=5;
    sunLight.intensity=2;
  } else {
    renderer.setClearColor(0x03050e, 1);
    starMat.color.set(0xffffff); starMat.opacity=0.55; starMat.size=0.18;
    ambientLight.color.set(0x334466); ambientLight.intensity=2.5;
    sunLight.intensity=5;
  }
  starMat.needsUpdate=true;
  // update CSS label style
  document.querySelectorAll('.label3d').forEach(l=>{
    l.classList.toggle('label-light', isLight);
  });
}

document.getElementById('zoom-backdrop').addEventListener('click', ()=>{
  if(document.body.classList.contains('zoomed-in')) closeCard();
  else if(viewState!=='root') switchView('root');
});
document.getElementById('content-card').addEventListener('click', e=>e.stopPropagation());
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(document.body.classList.contains('zoomed-in')) closeCard();
    else if(viewState!=='root') switchView('root');
  }
});

window.addEventListener('resize',()=>{
  const W=window.innerWidth,H=window.innerHeight;
  camera.aspect=W/H; camera.updateProjectionMatrix();
  renderer.setSize(W,H); labelRenderer.setSize(W,H);
});

// ── Init ──────────────────────────────────────────────────────────────────
// Always dark mode
applyTheme(false);
buildRootScene();
updateLegend();
animate();
</script>
